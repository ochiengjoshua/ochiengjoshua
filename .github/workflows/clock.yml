name: Update Live Clock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update clock in README
        run: |
          NOW=$(TZ="Africa/Nairobi" date "+%A, %d %B %Y — %H:%M %Z")
          sed -i "s|<!--CLOCK_START-->.*<!--CLOCK_END-->|<!--CLOCK_START-->${NOW}<!--CLOCK_END-->|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update live clock"
          git push
