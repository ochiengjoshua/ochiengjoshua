name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ochiengjoshua
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D7A86E&color_dots=%23EFE6D8,%23DCC7A1,%23C7A576,%23B08968,%238A6E4E&color_dark=%232B2621
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E8C39E&color_dots=%233A3229,%234A4034,%236B5843,%238A6E4E,%23B08968&color_dark=%23191512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
